<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sania Pet — Ficha Médica Veterinaria Inteligente</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <div class="app-layout">
    <!-- Top Navbar -->
    <header class="top-navbar">
      <div class="brand-section">
        <div class="brand-logo-wrap">🐾</div>
        <div class="brand-info">
          <div class="brand-title">sania<span>pet</span></div>
          <div class="brand-subtitle">Ficha Médica Veterinaria</div>
        </div>
      </div>

      <!-- Active Pet Switcher -->
      <div class="pet-switcher" id="petSwitcher">
        <!-- Rendered dynamically -->
      </div>

      <!-- Actions -->
      <div class="navbar-actions">
        <button id="addPetBtn" class="btn btn-outline btn-sm" title="Agregar otra mascota">
          <span>+ Mascota</span>
        </button>
        <button id="quickAddBtn" class="btn btn-primary btn-sm">
          <span>+ Registro</span>
        </button>
        <button id="themeToggleBtn" class="btn btn-outline btn-sm" title="Cambiar tema">
          🌙
        </button>
      </div>
    </header>

    <!-- App Body with Desktop Sidebar and Content -->
    <div class="app-body">
      <!-- Sidebar (Desktop) -->
      <nav class="sidebar-nav">
        <button class="nav-item active" data-tab="dashboard">
          <span>🏠</span>
          <span>Resumen General</span>
        </button>
        <button class="nav-item" data-tab="consultas">
          <span>🩺</span>
          <span>Consultas & Diagnósticos</span>
        </button>
        <button class="nav-item" data-tab="vacunas">
          <span>💉</span>
          <span>Vacunas & Inmunización</span>
        </button>
        <button class="nav-item" data-tab="desparasitaciones">
          <span>🪱</span>
          <span>Desparasitaciones</span>
        </button>
        <button class="nav-item" data-tab="medicamentos">
          <span>💊</span>
          <span>Medicamentos</span>
        </button>
        <button class="nav-item" data-tab="laboratorios">
          <span>🧪</span>
          <span>Laboratorios</span>
        </button>
        <button class="nav-item" data-tab="imagenes">
          <span>🩻</span>
          <span>Imágenes Médicas</span>
        </button>
        <button class="nav-item" data-tab="diario">
          <span>📖</span>
          <span>Diario de Salud</span>
        </button>
        <button class="nav-item" data-tab="peso">
          <span>⚖️</span>
          <span>Historial de Peso</span>
        </button>
        <button class="nav-item" data-tab="alertas">
          <span>🔔</span>
          <span>Alertas Activas</span>
          <span class="nav-item-badge" id="sidebarAlertCount" style="display:none;">0</span>
        </button>
        <button class="nav-item" data-tab="perfil">
          <span>👤</span>
          <span>Perfil & Propietario</span>
        </button>
      </nav>

      <!-- Main Content Area -->
      <main class="content-area" id="mainContent">
        <!-- Rendered by app.js based on active tab -->
        <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted);">
          <p>Cargando ficha médica de Sania Pet...</p>
        </div>
      </main>
    </div>

    <!-- Bottom Navigation Bar (Mobile) -->
    <nav class="bottom-navbar">
      <button class="bottom-nav-btn active" data-tab="dashboard">
        <span class="icon">🏠</span>
        <span>Inicio</span>
      </button>
      <button class="bottom-nav-btn" data-tab="consultas">
        <span class="icon">🩺</span>
        <span>Consultas</span>
      </button>
      <button class="bottom-nav-btn" data-tab="vacunas">
        <span class="icon">💉</span>
        <span>Vacunas</span>
      </button>
      <button class="bottom-nav-btn" data-tab="alertas">
        <span class="icon">🔔</span>
        <span>Alertas</span>
      </button>
      <button class="bottom-nav-btn" data-tab="perfil">
        <span class="icon">👤</span>
        <span>Perfil</span>
      </button>
    </nav>

    <!-- Mobile Floating Action Button -->
    <button class="fab-btn" id="mobileFab" title="Crear registro">+</button>
  </div>

  <!-- Dynamic Modal Container -->
  <div id="modalBackdrop" class="modal-backdrop" style="display: none;">
    <div class="modal-content" id="modalContent">
      <!-- Modal dynamically injected by app.js -->
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
